name: Build, Push, and Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-binaries:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
            artifact: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: ""
            artifact: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: ""
            artifact: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: ""
            artifact: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: .exe
            artifact: windows-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          output="dist/binance-bot_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X main.commitHash=${{ github.sha }}" \
            -o "$output" .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binance-bot-${{ matrix.artifact }}
          path: dist/binance-bot_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-and-push, build-binaries]

    permissions:
      contents: write

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binance-bot-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: dist/*
